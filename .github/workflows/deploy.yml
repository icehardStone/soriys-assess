name: Deploy to gomains.cn

on:
  push:
    branches: [ main ]      # 只有 main 分支推送才触发
  workflow_dispatch:         # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd /opt/assess/soriys-assess
            
            # 拉取最新代码
            git fetch --all
            git reset --hard origin/main
            
            # 构建并重启
            docker compose down
            docker compose build
            docker compose up -d
            
            # 清理旧镜像
            docker image prune -f
            
            echo "✅ 部署完成: $(date)"
          EOF