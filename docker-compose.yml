services:
  api:
    container_name: soriys-assess-api
    build:
      context: ./backend/elderly-assessment-api
    environment:
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-elderly_assessment}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    restart: unless-stopped
    networks:
      - traefik-network

  web:
    container_name: soriys-assess-front
    build:
      context: ./front
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"
      - "traefik.http.services.assess-web.loadbalancer.server.port=80"
      - "traefik.http.routers.assess.rule=Host(`assess.gomains.cn`)"
      - "traefik.http.routers.assess.entrypoints=websecure"
      - "traefik.http.routers.assess.tls=true"
      - "traefik.http.routers.assess.tls.certresolver=letsencrypt"

      - "traefik.http.routers.assess-http.rule=Host(`assess.gomains.cn`)"
      - "traefik.http.routers.assess-http.entrypoints=web"
      - "traefik.http.routers.assess-http.middlewares=https-redirect"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
networks:
  traefik-network:
    external: true
    driver: bridge
