services:
  api:
    build:
      context: ./backend/elderly-assessment-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://gomains:5432/${POSTGRES_DB:-elderly_assessment}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-elderly_assessment}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    restart: unless-stopped

  web:
    build:
      context: ./front
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped
